# Publishes to npm on a version tag, with no long-lived token.
# Auth is npm Trusted Publishing (OIDC): configure it once on npmjs.com —
# Package settings → Trusted Publisher → GitHub Actions → user: dandrok, repo: ai-review, workflow: release.yml
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # trusted publishing needs >= 22.14.0
      - name: npm 11.5.1+ is required for OIDC publishing
        run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match package.json $ver"; exit 1; }
      - name: diagnose OIDC
        # If this prints "none", the job has no id-token and npm will silently fall back
        # to token auth (which fails as ENEEDAUTH). If it prints "present", the OIDC
        # endpoint is fine and the failure is on the npmjs.com Trusted Publisher config:
        # wrong workflow filename, an Environment name that this workflow does not declare,
        # or "npm publish" not among the allowed actions.
        run: |
          echo "npm $(npm -v) / node $(node -v)"
          echo "OIDC env: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo present || echo none)"
          echo "actor: $GITHUB_ACTOR  ref: $GITHUB_REF  repo: $GITHUB_REPOSITORY"

      - name: publish
        shell: bash
        run: |
          set -o pipefail
          npm publish --provenance --access public --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: publish really happened?
        shell: bash
        # Two different failures look identical from the outside:
        #  1. npm staged the release (trusted publisher allows stage, not direct publish) -> red
        #  2. npm published it and is running automated review ("Validating") -> not a failure,
        #     the version is simply not readable from the registry yet -> yellow warning
        run: |
          ver="$(node -p "require('./package.json').version")"
          if grep -qiE 'npm stage|staged for approval' "$RUNNER_TEMP/publish.log"; then
            echo "::error::npm staged $ver instead of publishing it. Approve with 'npm stage approve', or tick 'npm publish' on the trusted publisher."
            exit 1
          fi
          for i in $(seq 1 50); do
            if npm view "@dandrok/ai-review@$ver" version >/dev/null 2>&1; then
              echo "live on the registry: $ver"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::$ver is not readable after 5 min. If the package page shows 'Validating', npm's automated review is still running and the release is fine — it will appear on its own." 
