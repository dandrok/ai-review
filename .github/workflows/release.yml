# Publishes to npm on a version tag, with no long-lived token.
# Auth is npm Trusted Publishing (OIDC): configure it once on npmjs.com —
# Package settings → Trusted Publisher → GitHub Actions → user: dandrok, repo: ai-review, workflow: release.yml
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # trusted publishing needs >= 22.14.0
      - name: npm 11.5.1+ is required for OIDC publishing
        run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match package.json $ver"; exit 1; }
      - name: publish
        run: npm publish --provenance --access public
