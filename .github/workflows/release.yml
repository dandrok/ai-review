# Publishes to npm on a version tag, with no long-lived token.
# Auth is npm Trusted Publishing (OIDC): configure it once on npmjs.com —
# Package settings → Trusted Publisher → GitHub Actions → user: dandrok, repo: ai-review, workflow: release.yml
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # trusted publishing needs >= 22.14.0
      - name: npm 11.5.1+ is required for OIDC publishing
        run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match package.json $ver"; exit 1; }
      - name: diagnose OIDC
        # If this prints "none", the job has no id-token and npm will silently fall back
        # to token auth (which fails as ENEEDAUTH). If it prints "present", the OIDC
        # endpoint is fine and the failure is on the npmjs.com Trusted Publisher config:
        # wrong workflow filename, an Environment name that this workflow does not declare,
        # or "npm publish" not among the allowed actions.
        run: |
          echo "npm $(npm -v) / node $(node -v)"
          echo "OIDC env: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo present || echo none)"
          echo "actor: $GITHUB_ACTOR  ref: $GITHUB_REF  repo: $GITHUB_REPOSITORY"

      - name: publish
        run: npm publish --provenance --access public --loglevel verbose

      - name: verify the version is actually live
        # npm can exit 0 after staging a release instead of publishing it (staged publishing
        # is always allowed for a trusted publisher; direct publish has to be ticked too).
        # Without this check a staged release looks like a green build and ships nothing.
        run: |
          ver="$(node -p "require('./package.json').version")"
          for i in $(seq 1 10); do
            live="$(npm view "@dandrok/ai-review@$ver" version 2>/dev/null || true)"
            if [ -n "$live" ]; then echo "live on the registry: $live"; exit 0; fi
            sleep 6
          done
          echo "::error::$ver is not on the registry. If it was staged, approve it (npm stage approve) or allow 'npm publish' on the trusted publisher."
          exit 1
