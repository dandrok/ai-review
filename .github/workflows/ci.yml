name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: dist/ is a build artifact, not a tracked file
        run: |
          if [ -n "$(git ls-files dist)" ]; then
            echo "::error::dist/ must not be committed."
            echo "Fix: git rm -r --cached dist"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - name: the bundle has no runtime dependencies
        run: |
          pkg="require('./package.json')"
          deps=$(node -p "Object.keys($pkg.dependencies||{}).length")
          test "$deps" = "0"
